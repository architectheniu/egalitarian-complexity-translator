name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip jsonschema pytest

      - name: Validate Capsule #001 against Schema & 8 Topology Laws
        run: python validator/ect_validate.py capsules/rh-2026-alpoege/capsule.jsonld

      - name: Run Topology Laws pytest suite
        run: python -m pytest validator/test_validator.py -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies & build Audiovisual Microscope
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
